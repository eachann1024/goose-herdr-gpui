[package]
name = "goose-herdr-gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
anyhow = "1"
log = "=0.4.34"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

zed-terminal = { path = "vendor/zed-terminal" }
portable-pty = "=0.9.0"
unicode-segmentation = "1"

[profile.release]
strip = true
lto = "thin"
