const icon=name=>`<span class="icon" style="--icon:url('${iconSources[name]}')" aria-hidden="true"></span>`;
function art(name){return `<div class="art-wrap"><img class="art" src="../../resources/illustrations/${name}.png" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="fallback" hidden>${icon(icons[name]||'screen')}</div></div>`}
function empty(name,title,description,actions=''){return `<section class="empty">${art(name)}<div class="empty-copy"><div class="console-heading">${name.toUpperCase()} / READY</div><h2>${title}</h2><p>${description}</p><div class="row">${actions}</div></div></section>`}
function toolbar(title,tail=''){return `<div class="screenbar"><strong>${title}</strong><span class="grow"></span>${tail}</div>`}
function draw(){document.body.dataset.variant=variant;$('#design-title').textContent=variant==='A'?'A / 暖纸工作室':'B / 石墨控制台';$('#variant-label').textContent=variant==='A'?'A · 暖纸工作室（推荐）':'B · 石墨控制台';$('#design-description').textContent=variant==='A'?'温润纸感，安静的工作秩序。把注意力留给手头的会话。':'紧凑、精确、持续在线。以设备和会话构建清晰的操作坐标。';$('#breadcrumb').textContent=names[page];
const nav=['workspace','files','search','settings'];$('#nav').innerHTML=nav.map(n=>`<button data-page="${n}" aria-current="${n===page?'page':'false'}">${icon(icons[n])}${names[n]}</button>`).join('');$('#rail').innerHTML=nav.map(n=>`<button data-page="${n}" aria-label="${names[n]}" title="${names[n]}" aria-current="${n===page?'page':'false'}">${icon(icons[n])}</button>`).join('');
if(page==='workspace'){main.innerHTML=toolbar(session?'完善终端布局':'工作区',`<button class="outline" id="toggle-session">${session?'查看欢迎空态':'查看已有会话'}</button>`)+(session?`<div class="terminal-toolbar"><span class="selected row">${icon('agents/codex')} Codex</span><span class="subtle tiny">studio / main</span><span class="grow"></span><span class="tiny subtle">会话示例</span></div><div class="terminal"><span class="comment">~/Projects/studio  ·  main</span>\n<span class="prompt">❯</span> codex\n\n<span class="ok">› 完善终端布局，保持现有快捷键与分屏能力。</span>\n\n  已读取 src/app.rs 和 src/terminal.rs。\n  先检查窗口最小尺寸和侧栏拖拽边界。\n\n<span class="comment">  Read  src/app.rs           256 lines\n  Read  src/terminal.rs      184 lines\n  Shell cargo build --release</span>\n\n<span class="ok">    Compiling studio v0.1.0</span>\n    Finished release profile [optimized] in 18.42s\n\n  已完成布局整理，保留终端输入与原生快捷键。\n  改动：2 files · +24 −31\n\n<span class="comment">────────────────────────────────────────────────</span>\n<span class="prompt">›</span> <span class="cursor"></span>\n\n<span class="comment">  以上为脱敏静态示例，不代表真实执行结果。</span></div>`:empty('workspace','留一张桌面，开始工作。','选择一个会话继续，或创建新的工作空间。终端、Agent 与文件，都留在顺手的位置。',`<button class="primary" data-new="space">${icon('plus')}新建空间</button><button class="outline" data-session="active">打开独立终端</button>`));}
if(page==='files')main.innerHTML=toolbar('文件',`<span class="path">~/Projects/playground</span>`)+`<div class="screenbar"><span class="subtle tiny">名称</span><span class="grow"></span><span class="subtle tiny">大小 / 修改时间</span></div>`+empty('files','这个目录还是空的','当前目录没有文件。切换工作空间后，这里将显示对应设备上的文件。',`<button class="outline" data-page="workspace">${icon('arrow_left')}返回工作区</button>`);
if(page==='search')main.innerHTML=toolbar('搜索')+`<div class="screenbar"><label for="query">关键词</label><input id="query" type="search" value="未命名实验" style="flex:1;min-width:0"><button id="clear-search" class="outline">清除</button></div>`+empty('search','没有匹配的会话','没有找到与当前关键词匹配的空间或会话。试试更短的关键词。')+`<div class="design-notes">无结果场景示例 · 不查询真实会话</div>`;
if(page==='settings')main.innerHTML=`<section class="settings"><header><div class="eyebrow">PREFERENCES</div><h1>设置</h1><p class="subtle">只保留必要的层级，让每个选项容易找到。</p></header><h3>外观</h3><div class="setting"><div><label for="appearance">应用外观</label><p>此处为控件示例，不更改候选设计方向。</p></div><select id="appearance"><option>跟随系统</option><option>浅色</option><option>深色</option></select></div><h3>终端</h3><div class="setting"><div><label for="font">字体</label><p>终端使用等宽字体。</p></div><select id="font"><option>Menlo</option><option>Monaco</option></select></div><div class="setting"><div><label for="font-size">字号</label><p>支持 9–22 的终端字号。</p></div><input id="font-size" type="number" min="9" max="22" step="0.5" value="12.5" style="width:96px"></div><div class="setting"><div><label for="bell">桌面通知</label><p>Agent 完成任务或等待处理时发送提醒。</p></div><input id="bell" type="checkbox" checked></div><p class="subtle tiny" style="margin-top:24px">所有设置仅存在本页内存中，不写入应用配置。</p></section>`;
if(page==='assets')main.innerHTML=toolbar('素材应用一览',`<span class="subtle tiny">5 个状态 / 一套视觉语言</span>`)+`<div class="gallery">${Object.entries(artNames).map(([key,name])=>`<article class="sample">${art(key)}<h3>${name}</h3><p>${key}.png · 装饰图，不承载操作信息</p></article>`).join('')}</div><div class="design-notes"><div>图片未就绪时显示现有 SVG 图标。<br>常用操作继续复用单色 SVG，不把生成图片当按钮。</div><span class="grow"></span><div class="swatches" aria-label="候选主题色板">${['--bg','--side','--fg','--accent'].map(c=>`<span class="swatch" style="background:var(${c})" title="${c}"></span>`).join('')}</div></div>`;
}
function switchVariant(){variant=variant==='A'?'B':'A';const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);draw()}
$('#previous').onclick=$('#next').onclick=switchVariant;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;draw()}if(b.dataset.session){page='workspace';session=true;draw()}if(b.id==='toggle-session'){session=!session;draw()}if(b.id==='clear-search'){$('#query').value='';$('#query').focus()}if(b.dataset.new||b.id==='add-space'){$('#new-dialog').showModal()}if(b.id==='device'){page='workspace';session=false;draw()}});
$('#new-dialog').addEventListener('close',()=>{if($('#new-dialog').returnValue==='create'){session=true;page='workspace';draw()}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||$('#new-dialog').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant()}});
draw();
</script></body></html>
